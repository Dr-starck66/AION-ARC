name: ARC3 Kaggle Notebook Gate

on:
  push:
    branches: [arc3-kaggle-100]
  pull_request:
    paths:
      - "kaggle/**"
      - ".github/workflows/arc3-notebook-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit test AION guard
        run: python -m unittest -v kaggle/test_aion_guard.py

      - name: Validate AION v2.4 Kaggle notebook
        shell: bash
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path

          path = Path("kaggle/AION-ARC-v2.4-persistent-host.ipynb")
          nb = json.loads(path.read_text())
          assert nb["nbformat"] == 4
          assert str(nb["metadata"]["aion_arc"]["version"]).startswith("2.4")
          assert nb["metadata"]["aion_arc"]["status"] == "UNVERIFIED"

          cells = nb["cells"]
          ids = [c.get("id") for c in cells]
          assert "aion-v21-overlay" in ids
          assert "aion-v22-scientific" in ids
          assert "aion-v23-host-guard" in ids
          assert "aion-v24-persistent-host-memory" in ids
          assert "10" in ids
          assert ids.index("aion-v21-overlay") < ids.index("aion-v22-scientific") < ids.index("aion-v23-host-guard") < ids.index("aion-v24-persistent-host-memory") < ids.index("10")

          for cid in ("aion-v21-overlay", "aion-v22-scientific", "aion-v22-efficiency", "aion-v22-tournament", "aion-v23-host-guard", "aion-v24-persistent-host-memory"):
              cell = next(c for c in cells if c.get("id") == cid)
              ast.parse("".join(cell.get("source", [])))

          whole = "\n".join(
              "".join(c.get("source", [])) if isinstance(c.get("source"), list)
              else str(c.get("source", ""))
              for c in cells
          )

          required = [
              "jeroencottaar/taaf-kaggle-source-share",
              "driessmit1/arc3-vllm-h100-wheelhouse-v3",
              "driessmit1/vrfai-qwen3-6-27b-fp8-hf-snapshot",
              "MYTHOS ASTRA Ω",
              "NO-REPEAT Ω",
              "TARDIGRADE Ω",
              "aion_frame_signature",
              "aion_evidence",
              "aion_plan_audit",
              "aion_information_gain",
              "aion_choose_probe",
              "aion_state_graph",
              "aion_prediction_match",
              "expect_gameplay_change",
              "aion_prediction_mismatch",
              "aion_plan_aborted",
              "aion_rollback_verified",
              "rollback_on_mismatch",
              "force_probe",
              "compact executable transition model",
              "assert AION_SANDBOX_SENTINEL",
              "aion_host_batch_rejected",
              "aion_host_seen_signatures",
              "aion_host_mismatches",
              "aion_host_rollback_verified",
              "aion_known_negative_edge",
              "self._aion_negative_state_actions",
              "known fatal action from this semantic state",
              "level_changed = (",
              'aion_host_reason"] = "level_change"',
              'self._step_env_callback({"actions": [engine_spec]})',
              'if last_result.get("aion_host_stop")',
              "--no-index",
          ]
          missing = [x for x in required if x not in whole]
          assert not missing, f"missing required AION v2.4 guards: {missing}"

          forbidden_claims = ["KAGGLE SCORE: PASS", "hidden score = 100", "official score 100%"]
          bad = [x for x in forbidden_claims if x.lower() in whole.lower()]
          assert not bad, f"forbidden unverified score claims: {bad}"

          print("ARC3 AION V2.4 PERSISTENT-HOST NOTEBOOK GATE: PASS")
          PY
