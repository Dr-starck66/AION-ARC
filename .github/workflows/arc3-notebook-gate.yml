name: ARC3 Kaggle Notebook Gate

on:
  push:
    branches: [arc3-kaggle-100]
  pull_request:
    paths:
      - "kaggle/**"
      - ".github/workflows/arc3-notebook-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit test AION guard
        run: python -m unittest -v kaggle/test_aion_guard.py

      - name: Validate AION v2.1 Kaggle notebook
        shell: bash
        run: |
          python - <<'PY'
          import ast, json
          from pathlib import Path

          path = Path("kaggle/AION-ARC-v2.1-tardigrade.ipynb")
          nb = json.loads(path.read_text())
          assert nb["nbformat"] == 4
          assert nb["metadata"]["aion_arc"]["version"] == "2.1"
          assert nb["metadata"]["aion_arc"]["status"] == "UNVERIFIED"

          cells = nb["cells"]
          ids = [c.get("id") for c in cells]
          assert "aion-v21-overlay" in ids
          assert "10" in ids
          assert ids.index("aion-v21-overlay") < ids.index("10"), "overlay must run before benchmark unpickle"

          overlay = next(c for c in cells if c.get("id") == "aion-v21-overlay")
          source = "".join(overlay.get("source", []))
          ast.parse(source)

          whole = "\n".join(
              "".join(c.get("source", [])) if isinstance(c.get("source"), list)
              else str(c.get("source", ""))
              for c in cells
          )

          required = [
              "jeroencottaar/taaf-kaggle-source-share",
              "driessmit1/arc3-vllm-h100-wheelhouse-v3",
              "driessmit1/vrfai-qwen3-6-27b-fp8-hf-snapshot",
              "MYTHOS ASTRA Ω",
              "NO-REPEAT Ω",
              "TARDIGRADE Ω",
              "aion_frame_signature",
              "aion_evidence",
              "aion_plan_audit",
              "aion_prediction_mismatch",
              "aion_plan_aborted",
              "aion_rollback_verified",
              "rollback_on_mismatch",
              "force_probe",
              "explicit compact transition model",
              "assert AION_SANDBOX_SENTINEL",
              "--no-index",
          ]
          missing = [x for x in required if x not in whole]
          assert not missing, f"missing required AION v2.1 guards: {missing}"

          # False-PASS hunt: v2.1 must not claim an official Kaggle score.
          forbidden_claims = ["KAGGLE SCORE: PASS", "hidden score = 100", "official score 100%"]
          bad = [x for x in forbidden_claims if x.lower() in whole.lower()]
          assert not bad, f"forbidden unverified score claims: {bad}"

          print("ARC3 AION V2.1 NOTEBOOK GATE: PASS")
          PY
